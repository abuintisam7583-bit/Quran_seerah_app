<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ ui.seerah }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fa;
            color: #263238;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #173b57;
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .topbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .language {
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px 45px;
        }

        .hero {
            background: white;
            padding: 28px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .hero-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #173b57;
            margin: 0 0 10px;
            font-size: 30px;
        }

        .intro {
            margin: 0;
            line-height: 1.7;
            font-size: 16px;
        }

        .chapters-title {
            color: #173b57;
            margin: 0 0 15px;
            font-size: 22px;
        }

        .chapters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .chapter-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .number {
            display: inline-block;
            background: #e8f1f7;
            color: #173b57;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chapter-card h3 {
            margin: 0 0 12px;
            color: #263238;
            line-height: 1.4;
            font-size: 18px;
        }

        .open-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #173b57;
            color: white;
            padding: 10px;
            border-radius: 9px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #173b57;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px 10px 35px;
            }

            .hero {
                padding: 22px 16px;
            }

            h1 {
                font-size: 25px;
            }

            .chapters {
                grid-template-columns: 1fr;
            }

            .chapter-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <a href="{{ url_for('seerah') }}">📖 {{ ui.seerah }}</a>

        <select class="language" onchange="changeLanguage(this.value)">
            {% for code, name in languages.items() %}
                <option value="{{ code }}" {% if code == lang %}selected{% endif %}>
                    {{ name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <main class="container">

        <section class="hero">
            <div class="hero-icon">🕌</div>

            <h1>{{ ui.seerah }}</h1>

            <p class="intro">
                {{ ui.introduction }}
            </p>
        </section>

        <h2 class="chapters-title">
            📚 {{ ui.chapters }}
        </h2>

        <section class="chapters">

            {% for chapter_id, chapter in chapters.items() %}

                <div class="chapter-card">

                    <div class="number">
                        {{ ui.chapter }} {{ chapter_id }}
                    </div>

                    <h3>
                        {{ chapter[lang].title }}
                    </h3>

                    <a class="open-btn"
                       href="{{ url_for('seerah_chapter', chapter_id=chapter_id, lang=lang) }}">
                        {{ ui.read }} →
                    </a>

                </div>

            {% endfor %}

        </section>

        <a class="back" href="/">
            ← {{ ui.home }}
        </a>

    </main>

    <script>
        function changeLanguage(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set("lang", lang);
            window.location.href = url.toString();
        }
    </script>

</body>
</html>
